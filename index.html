<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#0d1216">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="icon-192.png">
    <title>Rutinas · temporizador por actividad</title>
    <style>
        :root {
            --bg: #0d1216;
            --pn: #151c22;
            --ln: #26323b;
            --tx: #e6edf2;
            --mt: #93a4b0;
            --ac: #35d0c0;
            --ok: #4ade80;
            --bad: #f87171;
            --wr: #fbbf24;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:light) {
            :root:not([data-theme="dark"]) {
                --bg: #f3f6f8;
                --pn: #fff;
                --ln: #cfd9df;
                --tx: #14202a;
                --mt: #5b6b76;
                --ac: #0b8f82;
                --ok: #15803d;
                --bad: #b91c1c;
                --wr: #a16207
            }
        }

        :root[data-theme="light"] {
            --bg: #f3f6f8;
            --pn: #fff;
            --ln: #cfd9df;
            --tx: #14202a;
            --mt: #5b6b76;
            --ac: #0b8f82;
            --ok: #15803d;
            --bad: #b91c1c;
            --wr: #a16207
        }

        :root[data-theme="dark"] {
            --bg: #0d1216;
            --pn: #151c22;
            --ln: #26323b;
            --tx: #e6edf2;
            --mt: #93a4b0;
            --ac: #35d0c0;
            --ok: #4ade80;
            --bad: #f87171;
            --wr: #fbbf24
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif
        }

        #app {
            max-width: 620px;
            margin: 0 auto;
            padding: 16px
        }

        h1 {
            font-size: 20px;
            margin: 4px 0 12px;
            color: var(--ac)
        }

        h2 {
            font-size: 14px;
            margin: 18px 0 6px;
            color: var(--mt);
            text-transform: uppercase;
            letter-spacing: .5px
        }

        .mt {
            color: var(--mt);
            font-size: 13px
        }

        button {
            font: inherit;
            color: inherit;
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 10px 12px;
            min-height: 44px;
            cursor: pointer
        }

        button:hover {
            border-color: var(--ac)
        }

        button.p {
            background: var(--ac);
            color: #0b1216;
            border-color: var(--ac);
            font-weight: 700
        }

        button.d {
            color: var(--bad)
        }

        button:disabled {
            opacity: .35;
            cursor: default
        }

        input {
            font: inherit;
            color: var(--tx);
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 8px;
            min-height: 40px;
            min-width: 0
        }

        input:focus {
            outline: 2px solid var(--ac);
            outline-offset: -1px
        }

        .card {
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px
        }

        .card b {
            display: block;
            font-size: 16px
        }

        .acts {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            flex-wrap: wrap
        }

        .acts .p {
            flex: 1 1 100%
        }

        .row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px;
            align-items: center;
            background: var(--pn);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px
        }

        .row.cur {
            border-color: var(--ac);
            box-shadow: 0 0 0 1px var(--ac)
        }

        .row.past {
            opacity: .5
        }

        .row .t {
            display: flex;
            align-items: center;
            gap: 3px
        }

        .row .t input {
            width: 56px;
            text-align: center
        }

        .row .bt {
            grid-column: 1/-1;
            display: flex;
            gap: 6px;
            justify-content: flex-end
        }

        .row .bt button {
            min-height: 36px;
            padding: 4px 12px
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center
        }

        .rw {
            position: relative;
            width: min(78vw, 300px);
            margin: 12px auto
        }

        .rw svg {
            width: 100%;
            display: block;
            transform: rotate(-90deg)
        }

        .rw circle {
            fill: none;
            stroke-width: 7
        }

        .bg {
            stroke: var(--ln)
        }

        .fg {
            stroke: var(--ac);
            stroke-linecap: round;
            stroke-dasharray: 326.7;
            transition: stroke-dashoffset .3s linear
        }

        .ct {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 0 22%
        }

        .big {
            font-size: 46px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            line-height: 1
        }

        .nm {
            margin-top: 6px;
            font-size: 15px
        }

        .ctl {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin: 8px 0
        }

        .ctl2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin: 6px 0
        }

        .cu {
            display: flex;
            gap: 6px;
            margin: 6px 0
        }

        .cu input {
            flex: 1;
            max-width: 120px
        }

        .tot {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--mt);
            margin: 4px 0
        }

        .ok {
            color: var(--ok)
        }

        .nc {
            display: flex;
            gap: 6px
        }

        .nc input {
            flex: 1
        }

        select {
            font: inherit;
            color: var(--tx);
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 6px;
            padding: 6px;
            min-height: 40px;
            max-width: 112px
        }

        .seg {
            display: flex;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0 0;
            gap: 1px
        }

        .seg i {
            display: block
        }

        textarea {
            width: 100%;
            min-height: 220px;
            font: 12px ui-monospace, monospace;
            color: var(--tx);
            background: var(--bg);
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 8px
        }
    </style>
</head>

<body>
    <main id="app"></main>
    <script>
        const K = 'rt_v1', $ = id => document.getElementById(id), app = $('app');
        const uid = () => Math.random().toString(36).slice(2, 9), A = (n, m, s = 0, c = 0) => ({ id: uid(), n, s: m * 60 + s, c });
        const CL = ['#35d0c0', '#f87171', '#fbbf24', '#a78bfa', '#60a5fa', '#4ade80'], CN = ['General', 'Cuerpo', 'Estudio', 'Creativo', 'Casa', 'Descanso'];
        const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
        const f = s => { s = Math.max(0, Math.ceil(s)); const h = s / 3600 | 0, m = s % 3600 / 60 | 0, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0') };
        const lab = s => { const h = s / 3600 | 0, m = Math.round(s % 3600 / 60); return h ? h + ' h ' + m + ' min' : m + ' min' };
        const sum = a => a.reduce((t, x) => t + x.s, 0);
        function load() { try { return JSON.parse(localStorage.getItem(K)) } catch (e) { return null } }
        function save() { try { localStorage.setItem(K, JSON.stringify(R)) } catch (e) { } }
        let R = load() || [{ id: uid(), n: 'Mañana (5:00)', a: [A('Agua y movilidad', 5, 0, 1), A('Ejercicio', 50, 0, 1), A('Ducha, piel y desayuno', 30, 0, 4), A('Preparar comida del día', 10, 0, 4)] },
        { id: uid(), n: 'Cierre de la noche', a: [A('Piel y dientes', 10, 0, 1), A('Registro del día', 5, 0, 2), A('Planner de mañana', 10, 0, 2), A('Ropa y comida listas', 5, 0, 4)] }];
        let v = 'home', d = null, cd = null, run = null, tk = null, wl = null, ac = null, msg = '', io = '', nt = (() => { try { return localStorage.getItem('rt_n') === '1' } catch (e) { return false } })();
        const acts = () => v === 'edit' ? d.a : run.r.a;
        function notify(t, b) { if (!nt || !document.hidden) return; try { new Notification(t, { body: b }) } catch (e) { } }
        async function toggleNt() { if (nt) { nt = false; msg = '' } else { try { const p = await Notification.requestPermission(); nt = p === 'granted'; msg = nt ? '' : 'El navegador no concedió permiso de notificaciones.' } catch (e) { nt = false; msg = 'Este navegador no permite notificaciones aquí.' } } try { localStorage.setItem('rt_n', nt ? '1' : '0') } catch (e) { } render() }

        function beep(n) { try { ac = ac || new (window.AudioContext || webkitAudioContext)(); for (let k = 0; k < n; k++) { const o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value = k == n - 1 ? 880 : 660; g.gain.value = .15; const t = ac.currentTime + k * .25; o.start(t); o.stop(t + .18) } } catch (e) { } try { navigator.vibrate && navigator.vibrate(n > 1 ? [200, 100, 200] : 200) } catch (e) { } }
        async function lock() { try { wl = await navigator.wakeLock.request('screen') } catch (e) { } }
        function unlock() { try { wl && wl.release() } catch (e) { } wl = null }

        function list(a, rn) {
            return a.map((x, i) => {
                const cur = rn && i === rn.i, past = rn && i < rn.i, lk = past || cur, first = rn ? rn.i + 1 : 0, up = !lk && i > first, dn = !lk && i < a.length - 1;
                return `<div class="row${cur ? ' cur' : ''}${past ? ' past' : ''}" style="border-left:5px solid ${CL[x.c || 0]}"><span class="nc"><input data-f="n" data-i="${i}" value="${esc(x.n)}" aria-label="Nombre"${past ? ' disabled' : ''}><select data-f="c" data-i="${i}" aria-label="Categoría"${past ? ' disabled' : ''}>${CN.map((n, k) => `<option value="${k}"${(x.c || 0) === k ? ' selected' : ''}>${n}</option>`).join('')}</select></span>
<span class="t"><input data-f="m" data-i="${i}" type="number" min="0" inputmode="numeric" value="${x.s / 60 | 0}" aria-label="Minutos"${past ? ' disabled' : ''}>:<input data-f="s" data-i="${i}" type="number" min="0" max="59" inputmode="numeric" value="${String(x.s % 60).padStart(2, '0')}" aria-label="Segundos"${past ? ' disabled' : ''}></span>
${lk ? '' : `<span class="bt"><button data-a="up" data-i="${i}"${up ? '' : ' disabled'} aria-label="Subir">↑</button><button data-a="down" data-i="${i}"${dn ? '' : ' disabled'} aria-label="Bajar">↓</button><button class="d" data-a="rm" data-i="${i}" aria-label="Eliminar">✕</button></span>`}</div>`
            }).join('')
        }

        function render() { if (v === 'home') home(); else if (v === 'edit') edit(); else if (v === 'run') runUI(); else if (v === 'io') ioUI(); else done() }
        function ioUI() { app.innerHTML = `<h1>Exportar / importar</h1><p class="mt">Copia este texto para respaldar tus rutinas o llevarlas a otro dispositivo. Para importar, pega aquí el texto de otro respaldo y toca Importar.</p><textarea id="jt" spellcheck="false">${esc(JSON.stringify(R))}</textarea><div class="acts"><button class="p" data-a="cp">Copiar</button><button data-a="imp">Importar y agregar</button><button data-a="back">Volver</button></div><p class="mt ok">${io}</p>` }
        function home() {
            app.innerHTML = `<h1>Mis rutinas</h1>` + R.map((r, i) => `<div class="card"><b>${esc(r.n)}</b><span class="mt">${r.a.length} actividades · ${lab(sum(r.a))}</span><div class="seg">${r.a.map(x => `<i style="flex:${x.s};background:${CL[x.c || 0]}"></i>`).join('')}</div>
<div class="acts"><button class="p" data-a="start" data-i="${i}"${r.a.length ? '' : ' disabled'}>▶ Iniciar</button><button data-a="edit" data-i="${i}">Editar</button><button data-a="dup" data-i="${i}">Duplicar</button><button class="d" data-a="del" data-i="${i}">${cd === r.id ? '¿Seguro?' : 'Eliminar'}</button></div></div>`).join('') +
                `<button class="p" data-a="new" style="width:100%">+ Nueva rutina</button><div class="acts" style="margin-top:12px"><button data-a="io">Exportar / importar</button><button data-a="nt">Notificaciones: ${nt ? 'activadas' : 'desactivadas'}</button></div><p class="mt">${msg}</p><p class="mt">Sin límite de rutinas ni de actividades. Tus datos se guardan en este navegador; usa Exportar para respaldarlos. Las notificaciones avisan al terminar cada actividad solo si la pestaña sigue abierta en segundo plano.</p>`
        }
        function edit() {
            app.innerHTML = `<h1>${d.isNew ? 'Nueva rutina' : 'Editar rutina'}</h1><input data-f="rn" value="${esc(d.n)}" placeholder="Nombre de la rutina" style="width:100%;margin-bottom:10px">
<div class="tot"><span>${d.a.length} actividades</span><span>${lab(sum(d.a))}</span></div>${list(d.a)}
<button data-a="addact" style="width:100%;margin:4px 0 12px">+ Actividad</button><div class="acts"><button class="p" data-a="save">Guardar</button><button data-a="cancel">Cancelar</button></div>`}

        function begin() { const x = run.r.a[run.i]; run.tot = x.s * 1000; run.left = run.tot; run.endAt = Date.now() + run.left }
        function startRun(id) { const r = R.find(x => x.id === id); run = { r: JSON.parse(JSON.stringify(r)), i: 0, on: true, el: [] }; begin(); v = 'run'; msg = ''; try { ac = ac || new (window.AudioContext || webkitAudioContext)(); ac.resume() } catch (e) { } lock(); clearInterval(tk); tk = setInterval(tick, 250); render() }
        function stop() { clearInterval(tk); unlock(); run = null }
        const cur = () => run.on ? run.endAt - Date.now() : run.left;
        function tick() { if (!run || !run.on) return; if (cur() <= 0) { beep(3); next(true); return } paint() }
        function paint() {
            const l = cur(), t = $('tm'); if (!t) return; t.textContent = f(l / 1000); $('rg').style.strokeDashoffset = 326.7 * (1 - Math.max(0, Math.min(1, l / run.tot)));
            const rest = l / 1000 + sum(run.r.a.slice(run.i + 1)); $('rest').textContent = 'Restan ' + lab(rest); $('end').textContent = 'Termina ≈ ' + new Date(Date.now() + rest * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        }
        function add(ms) { const c = cur(); let nl = c + ms; if (nl < 1000) nl = 1000; const dl = nl - c; run.tot += dl; if (run.on) run.endAt += dl; else run.left = nl; run.r.a[run.i].s = Math.round(run.tot / 1000); render() }
        function next(auto) { run.el[run.i] = auto ? run.tot : run.tot - Math.max(0, cur()); run.i++; if (auto) notify('⏱ Terminó una actividad', run.r.a[run.i] ? 'Sigue: ' + run.r.a[run.i].n : 'Rutina completada'); if (run.i >= run.r.a.length) { clearInterval(tk); unlock(); v = 'done'; render(); return } begin(); render() }
        function runUI() {
            const a = run.r.a, x = a[run.i], nx = a[run.i + 1];
            app.innerHTML = `<div class="top"><button data-a="exit">✕ Salir</button><span class="mt">Actividad ${run.i + 1} de ${a.length}</span></div>
<div class="rw"><svg viewBox="0 0 120 120"><circle class="bg" r="52" cx="60" cy="60"/><circle id="rg" class="fg" r="52" cx="60" cy="60" style="stroke-dashoffset:0;stroke:${CL[x.c || 0]}"/></svg><div class="ct"><div class="big" id="tm"></div><div class="nm">${esc(x.n)}</div></div></div>
<div class="tot"><span id="rest"></span><span id="end"></span></div><div class="mt" style="text-align:center">${nx ? 'Siguiente: ' + esc(nx.n) + ' (' + lab(nx.s) + ')' : 'Última actividad'}</div>
<div class="ctl"><button data-a="plus" data-ms="-60000">−1 min</button><button data-a="plus" data-ms="60000">+1 min</button><button data-a="plus" data-ms="300000">+5 min</button><button data-a="plus" data-ms="900000">+15</button></div>
<div class="cu"><input id="cm" type="number" min="1" inputmode="numeric" placeholder="min"><button data-a="custom">Agregar minutos</button></div>
<div class="ctl2"><button data-a="prev"${run.i ? '' : ' disabled'}>◀ Anterior</button><button data-a="skip">Saltar ▶</button></div>
<button class="p" data-a="pause" style="width:100%;margin:6px 0">${run.on ? '⏸ Pausar' : '▶ Reanudar'}</button>
<h2>Actividades (edita, reordena o agrega en vivo)</h2>${list(a, run)}<button data-a="addact" style="width:100%;margin:4px 0">+ Actividad al final</button>
<button data-a="savert" style="width:100%">Guardar estos cambios en la rutina</button><p class="mt ok">${msg}</p>`; paint()
        }
        function done() {
            const a = run.r.a, pl = sum(a), ac2 = run.el.reduce((t, x) => t + x, 0) / 1000;
            app.innerHTML = `<h1>Rutina completada</h1><div class="card"><b>${esc(run.r.n)}</b><span class="mt">Planeado ${lab(pl)} · Real ${lab(ac2)}</span></div>` + a.map((x, i) => `<div class="row"><span>${esc(x.n)}</span><span class="mt">${f(x.s)} plan · ${f((run.el[i] || 0) / 1000)} real</span></div>`).join('') + `<button class="p" data-a="exit" style="width:100%;margin-top:8px">Volver</button>`
        }

        const ac_ = {
            new() { d = { id: uid(), n: '', a: [A('Actividad 1', 5)], isNew: 1 }; v = 'edit'; render() },
            edit(i) { d = JSON.parse(JSON.stringify(R[i])); v = 'edit'; render() },
            dup(i) { const c = JSON.parse(JSON.stringify(R[i])); c.id = uid(); c.n += ' (copia)'; c.a.forEach(x => x.id = uid()); R.splice(i + 1, 0, c); save(); render() },
            del(i) { if (cd === R[i].id) { R.splice(i, 1); cd = null; save() } else cd = R[i].id; render() },
            start(i) { startRun(R[i].id) },
            up(i) { const a = acts();[a[i - 1], a[i]] = [a[i], a[i - 1]]; render() },
            down(i) { const a = acts();[a[i + 1], a[i]] = [a[i], a[i + 1]]; render() },
            rm(i) { acts().splice(i, 1); render() },
            addact() { acts().push(A('Nueva actividad', 5)); render() },
            save() { d.n = d.n.trim() || 'Rutina sin nombre'; delete d.isNew; const k = R.findIndex(x => x.id === d.id); k < 0 ? R.push(d) : R[k] = d; save(); v = 'home'; render() },
            cancel() { v = 'home'; render() },
            exit() { stop(); v = 'home'; cd = null; msg = ''; render() },
            io() { io = ''; v = 'io'; render() },
            back() { v = 'home'; render() },
            nt() { toggleNt() },
            cp() { const t = $('jt'); t.select(); const ok = () => { io = 'Copiado.'; render() }, no = () => { io = 'Selecciona el texto y cópialo manualmente.'; render() }; try { navigator.clipboard.writeText(t.value).then(ok, no) } catch (e) { no() } },
            imp() { try { const j = JSON.parse($('jt').value); if (!Array.isArray(j)) throw 0; let n = 0; j.forEach(r => { if (!r || !Array.isArray(r.a)) return; R.push({ id: uid(), n: String(r.n || 'Rutina importada'), a: r.a.map(x => ({ id: uid(), n: String(x.n || 'Actividad'), s: Math.max(1, +x.s || 60), c: Math.min(5, Math.max(0, +x.c || 0)) })) }); n++ }); save(); io = n + ' rutinas importadas.' } catch (e) { io = 'JSON no válido. Pega el texto exportado completo.' } render() },
            pause() { if (run.on) { run.left = run.endAt - Date.now(); run.on = false } else { run.endAt = Date.now() + run.left; run.on = true } render() },
            plus(i, b) { add(+b.dataset.ms) },
            custom() { const m = +$('cm').value; if (m > 0) add(m * 60000) },
            skip() { next(false) },
            prev() { if (run.i > 0) { run.i--; begin(); run.on = true; render() } },
            savert() { const k = R.findIndex(x => x.id === run.r.id); if (k >= 0) { R[k] = JSON.parse(JSON.stringify(run.r)); save(); msg = 'Cambios guardados en la rutina.' } else msg = 'La rutina original ya no existe.'; render() }
        };
        app.onclick = e => { const b = e.target.closest('[data-a]'); if (b && ac_[b.dataset.a]) ac_[b.dataset.a](+b.dataset.i, b) };
        app.onchange = e => {
            const t = e.target, k = t.dataset.f; if (!k) return; if (k === 'rn') { d.n = t.value; return }
            const i = +t.dataset.i, x = acts()[i]; if (!x) return; if (k === 'c') { x.c = +t.value; render(); return } if (k === 'n') { x.n = t.value || 'Actividad'; return }
            const row = t.closest('.row'), sec = Math.max(1, (+row.querySelector('[data-f=m]').value || 0) * 60 + (+row.querySelector('[data-f=s]').value || 0));
            if (v === 'run' && i === run.i) add(sec * 1000 - run.tot); else { x.s = sec; render() }
        };
        document.addEventListener('visibilitychange', () => { if (!document.hidden) tick() });
        if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(() => { });
        render();
    </script>
</body>

</html>
